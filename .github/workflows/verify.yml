name: verify

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: pnpm verify (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # build → artifact:check → typecheck → lint → format → deps → test(+coverage 门槛)
      - name: Verify
        run: pnpm verify
